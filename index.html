<!doctype html>
<html lang="fr">

<head>
    <meta charset="utf-8">
    <title>PS5 — WebKit Exploit</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --purple-deep: #0d0b1a;
            --purple-mid: #180f38;
            --purple-accent: #7c3aed;
            --purple-glow: #a855f7;
            --text-dim: #6b7280;
            --text-muted: #9ca3af;
            --panel-bg: #110d24;
            --panel-border: rgba(124, 58, 237, 0.35);
            --font-ui: -apple-system, 'Segoe UI', Arial, sans-serif;
            --font-mono: 'Courier New', Courier, monospace;
        }

        html,
        body {
            height: 100%;
            overflow: hidden;
        }

        body {
            user-select: none;
            -webkit-user-select: none;
            font-family: var(--font-ui);
            background: linear-gradient(160deg, #2d1a5e 0%, #160d30 60%, #0c0a1e 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        /* Main panel */
        #panel {
            position: relative;
            z-index: 1;
            width: min(820px, 96vw);
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: 20px;
            box-shadow:
                0 0 0 1px rgba(124, 58, 237, 0.12),
                0 4px 6px rgba(0, 0, 0, 0.5),
                0 20px 60px rgba(0, 0, 0, 0.6);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* RUN wrapper — centré au-dessus du panel */
        #run-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            margin-bottom: 18px;
            z-index: 1;
            position: relative;
        }

        #fw-badge {
            font-family: var(--font-mono);
            font-size: 0.72rem;
            color: var(--purple-glow);
            letter-spacing: 0.5px;
        }

        /* Top bar (juste le badge FW) */
        #topbar {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 14px 24px 12px;
            border-bottom: 1px solid rgba(124, 58, 237, 0.2);
            flex-shrink: 0;
        }

        /* RUN button */
        #run {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 28px;
            background: linear-gradient(135deg, #7c3aed 0%, #a855f7 100%);
            border: none;
            border-radius: 12px;
            color: #fff;
            font-family: var(--font-ui);
            font-size: 1rem;
            font-weight: 800;
            letter-spacing: 1.5px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: transform 0.18s ease, box-shadow 0.25s ease, opacity 0.25s ease;
            box-shadow: 0 0 24px rgba(168, 85, 247, 0.4), 0 4px 12px rgba(0, 0, 0, 0.3);
            flex-shrink: 0;
            text-transform: uppercase;
            will-change: transform;
        }

        #run::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.15) 0%, transparent 60%);
            pointer-events: none;
        }

        #run:not(.disabled):hover {
            transform: translateY(-2px);
        }

        #run.disabled {
            opacity: 0.35;
            cursor: not-allowed;
            pointer-events: none;
            box-shadow: none;
        }

        /* #run.running pulse : opacity + scale sur un pseudo-element (GPU only, pas de repaint) */
        #run.running::after {
            content: '';
            position: absolute;
            inset: -3px;
            border-radius: 14px;
            background: transparent;
            border: 2px solid rgba(168, 85, 247, 0.7);
            animation: runPulse 1.4s ease-in-out infinite;
            pointer-events: none;
        }

        @keyframes runPulse {
            0%, 100% { opacity: 0.3; transform: scale(1); }
            50%       { opacity: 1;   transform: scale(1.04); }
        }

        .run-icon {
            width: 0;
            height: 0;
            border-left: 12px solid #fff;
            border-top: 7px solid transparent;
            border-bottom: 7px solid transparent;
            flex-shrink: 0;
            transition: transform 0.2s;
        }

        #run.running .run-icon {
            border: none;
            width: 14px;
            height: 14px;
            border: 3px solid #fff;
            border-radius: 50%;
            border-top-color: transparent;
            animation: spin 0.7s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* Log area — taille fixe, ne bouge jamais */
        #log-container {
            height: 340px;
            min-height: 340px;
            max-height: 340px;
            flex-shrink: 0;
            position: relative;
            overflow: hidden;
        }

        #log-scroll {
            height: 100%;
            overflow-y: auto;
            padding: 14px 20px;
            scrollbar-width: thin;
            scrollbar-color: rgba(124, 58, 237, 0.4) transparent;
        }

        #log-scroll::-webkit-scrollbar {
            width: 6px;
        }

        #log-scroll::-webkit-scrollbar-track {
            background: transparent;
        }

        #log-scroll::-webkit-scrollbar-thumb {
            background: rgba(124, 58, 237, 0.4);
            border-radius: 3px;
        }

        /* Fade top mask */
        #log-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 36px;
            background: linear-gradient(to bottom, var(--panel-bg) 0%, transparent 100%);
            pointer-events: none;
            z-index: 2;
        }

        .log-line {
            font-family: var(--font-mono);
            font-size: 0.75rem;
            line-height: 1.7;
            white-space: pre-wrap;
            word-break: break-all;
            display: flex;
            align-items: flex-start;
            gap: 8px;
        }

        .log-ts {
            color: rgba(107, 114, 128, 0.6);
            font-size: 0.66rem;
            flex-shrink: 0;
            padding-top: 1px;
            min-width: 52px;
        }

        .log-text {
            flex: 1;
        }

        /* Color palette — cycling */
        .lc-0 {
            color: #22d3ee;
        }

        .lc-1 {
            color: #4ade80;
        }

        .lc-2 {
            color: #facc15;
        }

        .lc-3 {
            color: #fb923c;
        }

        .lc-4 {
            color: #f472b6;
        }

        .lc-5 {
            color: #60a5fa;
        }

        .lc-6 {
            color: #a3e635;
        }

        .lc-7 {
            color: #c084fc;
        }

        .lc-8 {
            color: #34d399;
        }

        .lc-9 {
            color: #fda4af;
        }

        /* Special overrides */
        .log-ok {
            color: #4ade80 !important;
            font-weight: 700;
        }

        .log-err {
            color: #f87171 !important;
            font-weight: 700;
        }

        .log-info {
            color: #60a5fa !important;
        }

        .log-warn {
            color: #facc15 !important;
        }

        .log-fatal {
            color: #f87171 !important;
            font-weight: 700;
            text-shadow: 0 0 10px rgba(248, 113, 113, 0.6);
        }

        /* Empty state */
        #log-empty {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            min-height: 200px;
            gap: 10px;
            color: var(--text-dim);
        }

        #log-empty .empty-icon {
            font-size: 2.5rem;
            opacity: 0.3;
            animation: blink 2.5s ease-in-out infinite;
        }

        @keyframes blink {

            0%,
            100% {
                opacity: 0.15;
            }

            50% {
                opacity: 0.45;
            }
        }

        #log-empty p {
            font-size: 0.82rem;
            color: var(--text-dim);
        }

        /* Bottom bar */
        #bottombar {
            border-top: 1px solid rgba(124, 58, 237, 0.2);
            padding: 14px 24px 18px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex-shrink: 0;
        }

        #status-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }

        #msg {
            font-size: 0.78rem;
            color: var(--text-muted);
            font-family: var(--font-mono);
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        #pct-label {
            font-family: var(--font-mono);
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--purple-glow);
            flex-shrink: 0;
            min-width: 38px;
            text-align: right;
        }

        /* Progress bar */
        #progress-track {
            width: 100%;
            height: 6px;
            background: rgba(124, 58, 237, 0.15);
            border-radius: 999px;
            overflow: hidden;
        }

        #progress-fill {
            height: 100%;
            width: 0%;
            border-radius: 999px;
            background: linear-gradient(90deg, #7c3aed 0%, #a855f7 50%, #c084fc 100%);
            transition: width 0.4s cubic-bezier(.4, 0, .2, 1);
            box-shadow: 0 0 10px rgba(168, 85, 247, 0.6);
            position: relative;
        }

        /* Pas de pseudo-element ::after sur progress-fill (layer inutile) */

        /* scan : transform au lieu de left pour eviter le layout */
        #progress-fill.scanning::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.45), transparent);
            animation: scan 1.1s linear infinite;
            will-change: transform;
        }

        @keyframes scan {
            from { transform: translateX(-100%); }
            to   { transform: translateX(300%); }
        }
    </style>
</head>

<body>

    <!-- RUN centré au-dessus du rectangle -->
    <div id="run-wrapper">
        <button id="run" class="disabled" tabindex="0">
            <span class="run-icon" id="run-icon"></span>
            <span id="run-label">RUN</span>
        </button>
    </div>

    <div id="panel">

        <!-- TOP BAR : badge FW uniquement -->
        <div id="topbar">
            <span id="fw-badge">FW: detecting…</span>
        </div>

        <!-- LOG AREA -->
        <div id="log-container">
            <div id="log-scroll">
                <div id="log-empty">
                    <div class="empty-icon">⬡</div>
                    <p>En attente de l'exploit…</p>
                </div>
            </div>
        </div>

        <!-- BOTTOM BAR -->
        <div id="bottombar">
            <div id="status-row">
                <span id="msg">Chargement des offsets…</span>
                <span id="pct-label">0%</span>
            </div>
            <div id="progress-track">
                <div id="progress-fill"></div>
            </div>
        </div>

    </div>

    <script>
        "use strict";
        const OFFSETS_URL = "offsets/offsets.json";

        const runBtn = document.getElementById("run");
        const runLabel = document.getElementById("run-label");
        const msg = document.getElementById("msg");
        const fwBadge = document.getElementById("fw-badge");
        const logScroll = document.getElementById("log-scroll");
        const fill = document.getElementById("progress-fill");
        const pctLabel = document.getElementById("pct-label");

        /* Firmware detection */
        const m = /PlayStation 5\/(\d+)\.(\d+)/.exec(navigator.userAgent);
        const fw = m ? `${m[1].padStart(2, "0")}.${m[2].padStart(2, "0")}` : null;
        fwBadge.textContent = fw ? `FW: ${fw}` : "FW: non-PS5 browser";

        let entry = null;
        let colorIdx = 0;
        let exploitProgress = 20;
        let isRunning = false;
        let exploitLoaded = false;

        /* Log rendering */
        function getLogClass(text) {
            const t = text.toLowerCase();
            if (/\[fatal\]|\[crash\]/.test(t)) return "log-fatal";
            if (/\[err/.test(t) || /error/.test(t)) return "log-err";
            if (/\[ok\]|\[success\]|succe/.test(t)) return "log-ok";
            if (/\[warn/.test(t)) return "log-warn";
            if (/\[info\]|\[get\]|\[post\]/.test(t)) return "log-info";
            return null;
        }

        /* ── Log system ── */
        let scrollPending = false;   // un seul rAF de scroll en vol
        let lastProgressUpdate = 0; // throttle progress updates

        function addLog(text) {
            // Retire l'état vide une seule fois
            const empty = document.getElementById("log-empty");
            if (empty) empty.remove();

            // Build la ligne entièrement hors-DOM
            const now = new Date();
            const ts  = `${String(now.getHours()).padStart(2,"0")}:${String(now.getMinutes()).padStart(2,"0")}:${String(now.getSeconds()).padStart(2,"0")}`;

            const tsEl = document.createElement("span");
            tsEl.className = "log-ts";
            tsEl.textContent = ts;

            const txtEl = document.createElement("span");
            txtEl.className = "log-text";
            const special = getLogClass(text);
            if (special) {
                txtEl.className += " " + special;
            } else {
                txtEl.className += " lc-" + (colorIdx++ % 10);
            }
            txtEl.textContent = text;

            const line = document.createElement("div");
            line.className = "log-line";
            line.append(tsEl, txtEl);
            logScroll.appendChild(line);

            // Trim : garde les 200 derniers
            if (logScroll.children.length > 200) logScroll.firstChild.remove();

            // Scroll : un seul rAF partagé (évite N callbacks simultanés)
            if (!scrollPending) {
                scrollPending = true;
                requestAnimationFrame(function() {
                    logScroll.scrollTop = logScroll.scrollHeight;
                    scrollPending = false;
                });
            }

            // Progress : throttle à 1 update / 80ms max
            if (isRunning && exploitProgress < 95) {
                exploitProgress = Math.min(95, exploitProgress + 0.8);
                const now2 = Date.now();
                if (now2 - lastProgressUpdate > 80) {
                    lastProgressUpdate = now2;
                    setProgress(Math.round(exploitProgress), true);
                }
            }
        }

        /* Progress bar */
        function setProgress(pct, scanning) {
            pct = Math.max(0, Math.min(100, pct));
            fill.style.width = pct + "%";
            pctLabel.textContent = pct + "%";
            fill.classList.toggle("scanning", !!scanning);
        }

        /* Offsets loading */
        function fwNum(s) {
            const p = s.split(".");
            return parseInt(p[0], 10) * 100 + parseInt(p[1], 10);
        }

        function nearest(data, target) {
            const want = fwNum(target);
            const maj = target.split(".")[0];
            let best = null, bestd = 1e9;
            for (const k in data) {
                if (k.split(".")[0] !== maj) continue;
                const d = Math.abs(fwNum(k) - want);
                if (d < bestd) { bestd = d; best = k; }
            }
            return best;
        }

        setProgress(10);
        addLog("[INFO] Chargement des offsets firmware…");

        fetch(OFFSETS_URL, { cache: "no-store" })
            .then(r => r.json())
            .then(data => {
                setProgress(40);
                if (!fw) {
                    msg.textContent = "⚠ Navigateur non-PS5 détecté";
                    addLog("[WARN] UserAgent non-PS5 — mode debug");
                    return;
                }
                entry = data[fw];
                if (entry) {
                    msg.textContent = `✓ FW ${fw} — offsets chargés`;
                    addLog(`[OK] FW ${fw} — offsets exacts trouvés`);
                    runBtn.classList.remove("disabled");
                    setProgress(100);
                } else {
                    const near = nearest(data, fw);
                    if (near) {
                        entry = data[near];
                        msg.textContent = `⚠ FW ${fw} — offsets approximatifs (${near})`;
                        addLog(`[WARN] FW ${fw}: pas d'offsets exacts, utilisation de ${near}`);
                        runBtn.classList.remove("disabled");
                        setProgress(80);
                    } else {
                        msg.textContent = `✗ FW ${fw} non supporté`;
                        addLog(`[ERR] FW ${fw} non supporté — aucun offset disponible`);
                        setProgress(0);
                    }
                }
            })
            .catch(() => {
                msg.textContent = "✗ Échec du chargement des offsets";
                addLog("[ERR] Impossible de charger offsets/offsets.json");
                setProgress(0);
            });

        /* ── Expose addLog pour exploit.js ── */
        window.addLog = addLog;

        window.addExploitStatus = function (text, cls) {
            if (cls === "ok") {
                msg.textContent = "✓ SUCCESS — Notification envoyée !";
                setProgress(100, false);
                runBtn.classList.remove("running");
                runLabel.textContent = "RUN";
                isRunning = false;
            } else if (cls === "bad") {
                msg.textContent = "✗ Échec — retry en cours…";
            } else {
                msg.textContent = text;
            }
        };

        runBtn.addEventListener("click", function () {
            if (!entry || isRunning) return;
            isRunning = true;

            runBtn.classList.add("running");
            runLabel.textContent = "RUNNING";
            msg.textContent = "⚡ Exploit en cours…";
            exploitProgress = 20;
            setProgress(20, true);

            addLog("[INFO] Lancement de l'exploit…");

            if (exploitLoaded) {
                // Déjà chargé (l'exploit tourne et retry tout seul)
                addLog("[INFO] Exploit déjà actif — retry auto en cours");
                return;
            }
            exploitLoaded = true;

            // Prépare les paramètres pour exploit.js
            const q = new URLSearchParams();
            q.set("go", "1");
            q.set("fw", fw || "11.60");
            q.set("hc", entry.hc.join(","));
            q.set("gd", entry.gd);
            q.set("notify", entry.nt);
            q.set("gps", entry.gps);
            q.set("gpe", entry.gpe);
            q.set("cls", entry.cls);
            q.set("cle", entry.cle);
            q.set("ers", entry.ers);
            q.set("ere", entry.ere);

            window.EXPLOIT_PARAMS = q;

            // Injecte exploit.js dynamiquement dans la page
            const s = document.createElement("script");
            s.src = "exploit.js?_=" + Date.now(); // cache-bust
            s.onerror = function () {
                addLog("[ERR] Impossible de charger exploit.js");
                exploitLoaded = false;
                isRunning = false;
                runBtn.classList.remove("running");
                runLabel.textContent = "RUN";
                setProgress(0, false);
            };
            document.head.appendChild(s);
            addLog("[INFO] exploit.js injecté");
        });
    </script>
</body>

</html>
